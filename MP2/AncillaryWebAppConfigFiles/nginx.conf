# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;



events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

	# ADDED THIS UPSTREAM OBJECT MANUALLY (i.e. this is not included in the nginx.conf default file after install). 
	# This, along with the location / { proxy_pass } that is found in /etc/nginx/sites-enabled/*; <- Contains sym links for each file to /etc/nginx/sites-available/*
	# It is to point the local EC2 instance web server to the public EC2 ip4 address
    upstream MP2-web_server {
    	server 127.0.0.1:8000;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;
        root         /usr/share/nginx/html;

        # Load configuration files for the default server block.
        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }

		#location / {
		#	proxy_pass http://Hello;
		#}

		# ADDED THIS MANUALLY - Contains sym links to /etc/nginx/sites-available/*, which also had to be set up manually
		include /etc/nginx/sites-enabled/*;

    }

